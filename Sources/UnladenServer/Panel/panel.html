<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unladen</title>
<!-- Tabler's feather icon, the one beside the name, in the primary colour. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23066fd1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 20l10 -10m0 -5v5h5m-9 -1v5h5m-9 -1v5h5m-5 -5l4 -4l4 -4'/%3E%3Cpath d='M19 10c.638 -.636 1 -1.515 1 -2.486a3.515 3.515 0 0 0 -3.517 -3.514c-.97 0 -1.847 .367 -2.483 1m-3 13l4 -4l4 -4'/%3E%3C/svg%3E">
<script>
  // Before the page is drawn: the theme chosen in the panel, else the system's.
  (() => {
    let theme = null;
    try { theme = localStorage.getItem('unladen.theme'); } catch { /* the system's */ }
    document.documentElement.setAttribute('data-bs-theme', theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.6.1/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.49.0/dist/tabler-icons.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/@tabler/core@1.6.1/dist/js/tabler.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.5/dist/cdn.min.js"></script>
<style>
  [x-cloak] { display: none !important; }
  .mono { font-family: var(--tblr-font-monospace); }
  .table td { vertical-align: middle; }
  textarea.mono { font-size: .8125rem; }
  /* A provider's icon, on white in either theme: some are drawn in black. */
  .brand { background: #fff; color: #49566c; }
  .brand img { width: 62%; height: 62%; object-fit: contain; }
  .ti { font-size: 1.25em; vertical-align: -.15em; }
</style>
</head>
<body>
<div x-data="panel()" x-init="start()" x-cloak>

  <!-- Sign in -->
  <div class="page page-center" x-show="!token || !model">
    <div class="container container-tight py-4">
      <div class="text-center mb-4"><h1 class="h1"><i class="ti ti-feather me-2 text-primary"></i><span>Unladen</span></h1></div>
      <form class="card card-md" @submit.prevent="signIn()">
        <div class="card-body">
          <h2 class="h3 text-center mb-4">Control panel</h2>
          <label class="form-label">Panel token</label>
          <input type="password" class="form-control" x-model="tokenInput" autocomplete="current-password">
          <div class="form-hint">The value of panel.token in the configuration file.</div>
          <div class="text-danger mt-2" x-text="signInError"></div>
          <button class="btn btn-primary w-100 mt-4" type="submit"><i class="ti ti-login-2 me-1"></i>Sign in</button>
        </div>
      </form>
    </div>
  </div>

  <template x-if="token && model">
  <div class="page">
    <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" @click="navOpen = !navOpen" title="Menu"><span class="navbar-toggler-icon"></span></button>
        <div class="navbar-brand justify-content-lg-start px-lg-2"><i class="ti ti-feather me-2"></i><span>Unladen</span></div>
        <div class="navbar-collapse collapse" :class="navOpen && 'show'">
          <ul class="navbar-nav pt-lg-3">
            <template x-for="(p, i) in navigation" :key="i">
              <li :class="p.id ? 'nav-item' + (tab === p.id ? ' active' : '') : 'mt-3 px-3 subheader'">
                <template x-if="!p.id"><span x-text="p.label"></span></template>
                <template x-if="p.id">
                  <a class="nav-link" :href="'#' + p.id" @click.prevent="go(p.id)">
                    <span class="nav-link-icon d-md-none d-lg-inline-block"><i class="ti" :class="p.icon"></i></span>
                    <span class="nav-link-title" x-text="p.label"></span>
                    <span class="badge bg-red text-red-fg ms-auto" x-show="p.id === 'home' && attention().length" x-text="attention().length"></span>
                  </a>
                </template>
              </li>
            </template>
          </ul>
          <ul class="navbar-nav flex-grow-0 mt-auto pb-lg-3">
            <template x-for="l in languages.filter(l => l.id !== language)" :key="l.id">
              <li class="nav-item">
                <a class="nav-link" href="#" @click.prevent="setLanguage(l.id)">
                  <span class="nav-link-icon d-md-none d-lg-inline-block"><i class="ti ti-language"></i></span>
                  <span class="nav-link-title" x-text="l.label"></span>
                </a>
              </li>
            </template>
            <li class="nav-item">
              <a class="nav-link" href="#" @click.prevent="setTheme(theme === 'dark' ? 'light' : 'dark')">
                <span class="nav-link-icon d-md-none d-lg-inline-block"><i class="ti" :class="theme === 'dark' ? 'ti-sun' : 'ti-moon'"></i></span>
                <span class="nav-link-title" x-text="theme === 'dark' ? 'Light theme' : 'Dark theme'"></span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" @click.prevent="signOut()">
                <span class="nav-link-icon d-md-none d-lg-inline-block"><i class="ti ti-logout"></i></span>
                <span class="nav-link-title">Sign out</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </aside>

    <div class="page-wrapper">
      <div class="page-header d-print-none">
        <div class="container-xl">
          <div class="row g-2 align-items-center">
            <div class="col">
              <h2 class="page-title" x-text="page().label"></h2>
              <div class="text-secondary mt-1" x-text="page().about"></div>
            </div>
            <div class="col-auto ms-auto">
              <button class="btn btn-primary" x-show="tab === 'accounts'" @click="startAdding()"><i class="ti ti-plus me-1"></i>Add account</button>
              <button class="btn btn-primary" x-show="tab === 'models'" @click="startModel(null)"><i class="ti ti-plus me-1"></i>Add model</button>
              <button class="btn btn-primary" x-show="tab === 'clients'" @click="startClient(null)"><i class="ti ti-plus me-1"></i>Add client</button>
            </div>
          </div>
        </div>
      </div>

      <div class="page-body">
        <div class="container-xl">

          <!-- Home -->
          <div x-show="tab === 'home'">
            <div class="card mb-3" x-show="steps().some(s => !s.done)">
              <div class="card-body">
                <h3 class="card-title">Getting started</h3>
                <ul class="steps steps-counter steps-green my-4">
                  <template x-for="(s, i) in steps()" :key="i">
                    <li class="step-item" :class="i === steps().findIndex(s => !s.done) && 'active'" x-text="s.label"></li>
                  </template>
                </ul>
                <div class="text-center">
                  <template x-if="!steps()[0].done">
                    <div>
                      <p class="text-secondary">An account is a provider's API key, or a subscription you sign in to. The gateway spends from it to answer your tools.</p>
                      <button class="btn btn-primary" @click="go('accounts'); startAdding()"><i class="ti ti-plus me-1"></i>Add account</button>
                    </div>
                  </template>
                  <template x-if="steps()[0].done && !steps()[1].done">
                    <div>
                      <p class="text-secondary">A client key is what your tools present to the gateway. Without one, anyone who reaches the gateway may use it.</p>
                      <button class="btn btn-primary" @click="go('clients'); startClient(null)"><i class="ti ti-key me-1"></i>Add a client key</button>
                    </div>
                  </template>
                  <template x-if="steps()[0].done && steps()[1].done">
                    <p class="text-secondary mb-0">Point a tool at the gateway with the settings below. This card goes away with the first request.</p>
                  </template>
                </div>
              </div>
            </div>

            <div class="card mb-3" x-show="attention().length">
              <div class="card-header"><h3 class="card-title"><i class="ti ti-alert-triangle me-2 text-warning"></i>Needs attention</h3></div>
              <div class="list-group list-group-flush">
                <template x-for="(item, i) in attention()" :key="i">
                  <div class="list-group-item">
                    <div class="row align-items-center g-3">
                      <div class="col-auto"><i class="ti" :class="item.icon + ' text-' + item.kind"></i></div>
                      <div class="col" x-text="item.text"></div>
                      <div class="col-auto" x-show="item.action"><button class="btn btn-sm" @click="item.run()" x-text="item.action"></button></div>
                    </div>
                  </div>
                </template>
              </div>
            </div>

            <div class="d-flex align-items-center mb-2">
              <h3 class="mb-0 me-auto">Today</h3>
              <a href="#activity" class="text-secondary" @click.prevent="go('activity')">
                <i class="ti ti-loader-2 me-1"></i><span x-text="(activity?.in_flight || []).length + ' in flight'"></span>
              </a>
            </div>
            <div class="row row-cards mb-3">
              <template x-for="tile in tiles(today)" :key="tile.label">
                <div class="col-6 col-lg-3">
                  <div class="card card-sm"><div class="card-body">
                    <div class="row align-items-center">
                      <div class="col-auto"><span class="avatar bg-primary-lt"><i class="ti" :class="tile.icon"></i></span></div>
                      <div class="col">
                        <div class="h2 mb-0"><span x-text="tile.value"></span> <span class="fs-5 text-danger fw-normal" x-show="tile.note" x-text="tile.note"></span></div>
                        <div class="text-secondary" x-text="tile.label"></div>
                      </div>
                    </div>
                  </div></div>
                </div>
              </template>
            </div>

            <div class="row row-cards">
              <div class="col-lg-8">
                <div class="card">
                  <div class="card-header">
                    <ul class="nav nav-tabs card-header-tabs flex-nowrap text-nowrap overflow-auto">
                      <template x-for="a in apps" :key="a.id">
                        <li class="nav-item"><a class="nav-link" href="#" :class="app === a.id && 'active'" @click.prevent="app = a.id" x-text="a.label"></a></li>
                      </template>
                    </ul>
                  </div>
                  <div class="card-body">
                    <h3 class="card-title"><i class="ti ti-plug me-2"></i>Connect a tool</h3>
                    <div class="position-relative">
                      <pre class="mb-2" x-text="snippet(app)"></pre>
                      <button class="btn btn-sm btn-icon position-absolute top-0 end-0 m-2" title="Copy" @click="copy(snippet(app))"><i class="ti ti-copy"></i></button>
                    </div>
                    <div class="text-secondary" x-text="appNote(app)"></div>
                    <div class="text-secondary mt-2" x-show="model.clients.length">
                      <span>Put a client's key in place of YOUR_CLIENT_KEY.</span>
                      <a href="#clients" @click.prevent="go('clients')">Client keys</a>
                    </div>
                    <div class="text-secondary mt-2" x-show="!model.clients.length">No client key is set, so any value is taken as the key.</div>
                    <div class="text-secondary mt-2">The address is the one this page was opened at; another machine may reach the gateway at a different one.</div>
                  </div>
                </div>
              </div>
              <div class="col-lg-4">
                <div class="card">
                  <div class="card-header">
                    <h3 class="card-title"><i class="ti ti-wallet me-2"></i>Accounts</h3>
                    <div class="card-actions"><a href="#accounts" @click.prevent="go('accounts')">Manage</a></div>
                  </div>
                  <div class="list-group list-group-flush">
                    <template x-for="a in status?.accounts || []" :key="a.provider + ' ' + a.name">
                      <div class="list-group-item">
                        <div class="row align-items-center g-3">
                          <div class="col-auto">
                            <span class="avatar avatar-sm brand" x-data="{ failed: false }">
                              <img :src="brandIcon(a.provider) || null" x-show="brandIcon(a.provider) && !failed" @error="failed = true" alt="">
                              <span x-show="!brandIcon(a.provider) || failed" x-text="initials(a.provider)"></span>
                            </span>
                          </div>
                          <div class="col text-truncate">
                            <div class="mono text-truncate" x-text="a.name"></div>
                            <div class="text-secondary small" x-show="tightest(a.provider, a.name)">
                              <span x-text="tightest(a.provider, a.name) && Math.round(100 - tightest(a.provider, a.name).used) + '% left'"></span>
                              <span x-show="quotaOf(a.provider, a.name)?.plan" x-text="quotaOf(a.provider, a.name)?.plan"></span>
                            </div>
                            <div class="text-secondary small" x-show="!tightest(a.provider, a.name) && quotaOf(a.provider, a.name)?.balance" x-text="quotaOf(a.provider, a.name)?.balance"></div>
                          </div>
                          <div class="col-auto">
                            <span class="status" :class="'status-' + accountState(null, a).color"><span class="status-dot"></span><span x-text="accountState(null, a).label"></span></span>
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>
                  <div class="empty" x-show="!(status?.accounts || []).length">
                    <div class="empty-icon"><i class="ti ti-wallet-off"></i></div>
                    <p class="empty-title">No account yet</p>
                    <div class="empty-action"><button class="btn btn-primary" @click="go('accounts'); startAdding()"><i class="ti ti-plus me-1"></i>Add account</button></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Accounts -->
          <div x-show="tab === 'accounts'">
            <template x-for="g in accountGroups()" :key="g.provider">
              <div class="card mb-3">
                <div class="card-header">
                  <span class="avatar avatar-sm brand me-3" x-data="{ failed: false }">
                    <img :src="brandIcon(g.provider) || null" x-show="brandIcon(g.provider) && !failed" @error="failed = true" alt="">
                    <span x-show="!brandIcon(g.provider) || failed" x-text="initials(g.provider)"></span>
                  </span>
                  <div>
                    <h3 class="card-title mb-0" x-text="brandName(g.provider)"></h3>
                    <div class="text-secondary small mono" x-show="brandName(g.provider) !== g.provider" x-text="g.provider"></div>
                  </div>
                  <div class="card-actions" x-show="g.accounts.length + g.fromEnvironment.length > 1"><div class="d-flex align-items-center gap-2">
                    <span class="text-secondary" title="In order: the next account is used only when the one before fails. In turn: each request starts at the next account, which spreads load but breaks prompt caches.">Accounts are used</span>
                    <select class="form-select form-select-sm w-auto" @change="setPool(g.provider, $event.target.value)">
                      <option value="order" :selected="poolOf(g.provider) === 'order'">in order</option>
                      <option value="rotate" :selected="poolOf(g.provider) === 'rotate'">in turn</option>
                    </select>
                  </div></div>
                </div>
                <div class="list-group list-group-flush">
                  <template x-for="a in g.accounts" :key="a.uid">
                    <div class="list-group-item">
                      <div class="row align-items-center g-3">
                        <div class="col">
                          <div class="d-flex align-items-center flex-wrap gap-2">
                            <span class="mono fw-bold" x-text="a.name"></span>
                            <span class="status" :class="'status-' + accountState(a, inForce(a)).color">
                              <span class="status-dot"></span><span x-text="accountState(a, inForce(a)).label"></span>
                            </span>
                            <span class="text-secondary" x-show="inForce(a)?.cooling_seconds" x-text="inForce(a)?.cooling_seconds + 's'"></span>
                            <span class="badge bg-blue-lt" x-show="quotaOf(g.provider, a.name)?.plan || inForce(a)?.sign_in?.plan" x-text="quotaOf(g.provider, a.name)?.plan || inForce(a)?.sign_in?.plan"></span>
                            <span class="badge bg-secondary-lt" x-show="a.custom">own address</span>
                          </div>
                          <div class="text-secondary small mt-1" x-show="inForce(a)?.sign_in?.user" x-text="inForce(a)?.sign_in?.user"></div>
                          <div class="text-danger small mt-1" x-show="inForce(a)?.sign_in?.problem" x-text="inForce(a)?.sign_in?.problem"></div>
                        </div>
                        <div class="col-auto d-flex gap-2">
                          <button class="btn btn-sm btn-primary" x-show="inForce(a)?.sign_in && inForce(a).sign_in.state !== 'signed in'" @click="startSignIn(g.provider, a.name)"><i class="ti ti-login-2 me-1"></i>Sign in</button>
                          <button class="btn btn-sm" x-show="inForce(a) && inForce(a).state !== 'ready'" @click="resetKey(g.provider, a.name)"><i class="ti ti-refresh me-1"></i>Try it again</button>
                          <div class="dropdown">
                            <button class="btn btn-sm btn-ghost-secondary btn-icon" data-bs-toggle="dropdown" title="More"><i class="ti ti-dots-vertical"></i></button>
                            <div class="dropdown-menu dropdown-menu-end">
                              <a class="dropdown-item" href="#" @click.prevent="startAccount(a)"><i class="ti ti-pencil me-2"></i>Edit</a>
                              <a class="dropdown-item" href="#" x-show="inForce(a)?.sign_in" @click.prevent="startSignIn(g.provider, a.name)"><i class="ti ti-login-2 me-2"></i>Sign in again</a>
                              <a class="dropdown-item" href="#" x-show="inForce(a)?.sign_in && inForce(a).sign_in.state !== 'signed out'" @click.prevent="forgetSignIn(g.provider, a.name)"><i class="ti ti-user-off me-2"></i>Forget the sign-in</a>
                              <a class="dropdown-item" href="#" x-show="canMove(g, a, -1)" @click.prevent="moveAccount(g, a, -1)"><i class="ti ti-arrow-up me-2"></i>Use earlier</a>
                              <a class="dropdown-item" href="#" x-show="canMove(g, a, 1)" @click.prevent="moveAccount(g, a, 1)"><i class="ti ti-arrow-down me-2"></i>Use later</a>
                              <a class="dropdown-item" href="#" x-show="a.enabled" @click.prevent="setAccountEnabled(a, false)"><i class="ti ti-player-pause me-2"></i>Turn off</a>
                              <a class="dropdown-item" href="#" x-show="!a.enabled" @click.prevent="setAccountEnabled(a, true)"><i class="ti ti-player-play me-2"></i>Turn on</a>
                              <div class="dropdown-divider"></div>
                              <a class="dropdown-item text-danger" href="#" @click.prevent="removeAccount(a)"><i class="ti ti-trash me-2"></i>Remove</a>
                            </div>
                          </div>
                        </div>
                      </div>
                      <template x-if="quotaOf(g.provider, a.name)">
                        <div class="row g-3 mt-0">
                          <template x-for="(w, i) in quotaOf(g.provider, a.name).windows" :key="i">
                            <div class="col-sm-6 col-lg-4">
                              <div class="d-flex small">
                                <span class="text-secondary me-1" x-show="w.group" x-text="w.group"></span>
                                <span class="text-truncate" :class="w.name.includes('-') && 'mono'" x-text="w.name"></span>
                                <span class="ms-2 text-secondary text-nowrap" x-show="w.detail" x-text="w.detail"></span>
                                <span class="ms-auto ps-2 fw-bold text-nowrap" x-text="Math.round(100 - w.used) + '% left'"></span>
                              </div>
                              <div class="progress progress-sm my-1">
                                <div class="progress-bar" :class="quotaBarClass(w.used)" :style="'width: ' + (100 - w.used) + '%'"></div>
                              </div>
                              <div class="small text-secondary" x-show="w.resets_at" :title="w.resets_at && new Date(w.resets_at).toLocaleString()" x-text="resetsIn(w.resets_at)"></div>
                            </div>
                          </template>
                          <div class="col-sm-6 col-lg-4" x-show="quotaOf(g.provider, a.name).balance">
                            <div class="d-flex small"><span>Balance</span><span class="ms-auto fw-bold" x-text="quotaOf(g.provider, a.name).balance"></span></div>
                            <div class="small text-secondary" x-show="quotaOf(g.provider, a.name).balance_detail" x-text="quotaOf(g.provider, a.name).balance_detail"></div>
                          </div>
                          <div class="col-12 small text-danger" x-show="quotaOf(g.provider, a.name).error && !quotaOf(g.provider, a.name).see_at" x-text="quotaOf(g.provider, a.name).error"></div>
                          <div class="col-12 small text-secondary" x-show="quotaOf(g.provider, a.name).see_at">
                            <span x-text="quotaOf(g.provider, a.name).error"></span>
                            <a :href="quotaOf(g.provider, a.name).see_at" target="_blank" rel="noreferrer">Open the usage page</a>
                          </div>
                        </div>
                      </template>
                    </div>
                  </template>
                  <template x-for="s in g.fromEnvironment" :key="'env ' + s.name">
                    <div class="list-group-item">
                      <div class="row align-items-center g-3">
                        <div class="col">
                          <div class="d-flex align-items-center flex-wrap gap-2">
                            <span class="mono fw-bold" x-text="s.name"></span>
                            <span class="status" :class="'status-' + accountState(null, s).color"><span class="status-dot"></span><span x-text="accountState(null, s).label"></span></span>
                            <span class="badge bg-secondary-lt" title="The key comes from an environment variable, not from the configuration file.">from the environment</span>
                          </div>
                        </div>
                        <div class="col-auto">
                          <button class="btn btn-sm" x-show="s.state !== 'ready'" @click="resetKey(s.provider, s.name)"><i class="ti ti-refresh me-1"></i>Try it again</button>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
            <div x-show="accountGroups().length"><div class="d-flex text-secondary small">
              <span class="me-auto">Plans and balances are as the providers report them, read at most once in three minutes.</span>
              <a href="#" @click.prevent="refreshQuotas(true)"><i class="ti ti-refresh me-1"></i>Refresh</a>
            </div></div>
            <div class="card" x-show="!accountGroups().length">
              <div class="empty">
                <div class="empty-icon"><i class="ti ti-wallet-off"></i></div>
                <p class="empty-title">No account yet</p>
                <p class="empty-subtitle text-secondary">Add a provider's API key, or sign in to a subscription, and the gateway can answer your tools with it.</p>
                <div class="empty-action"><button class="btn btn-primary" @click="startAdding()"><i class="ti ti-plus me-1"></i>Add account</button></div>
              </div>
            </div>
          </div>

          <!-- Models -->
          <div x-show="tab === 'models'">
            <div class="card">
              <div class="table-responsive" x-show="model.models.length">
              <table class="table card-table table-vcenter">
                <thead><tr><th>Clients ask for</th><th>Answered by</th><th class="w-1"></th></tr></thead>
                <tbody>
                  <template x-for="r in model.models" :key="r.uid">
                    <tr>
                      <td>
                        <span class="mono fw-bold" x-text="r.name"></span>
                        <span class="badge bg-secondary-lt ms-2" x-show="r.name === '*'">every other name</span>
                      </td>
                      <td>
                        <template x-if="r.raw !== undefined">
                          <code class="text-secondary" x-text="JSON.stringify(r.raw)"></code>
                        </template>
                        <template x-if="r.raw === undefined && targetParts(r.target).kind === 'alias'">
                          <div><i class="ti ti-corner-down-right me-2 text-secondary"></i><span class="text-secondary">the same as</span> <span class="mono" x-text="targetParts(r.target).alias"></span></div>
                        </template>
                        <template x-if="r.raw === undefined && targetParts(r.target).kind === 'provider'">
                          <div class="d-flex align-items-center">
                            <span class="avatar avatar-xs brand me-2" x-data="{ failed: false }">
                              <img :src="brandIcon(targetParts(r.target).provider) || null" x-show="brandIcon(targetParts(r.target).provider) && !failed" @error="failed = true" alt="">
                              <span x-show="!brandIcon(targetParts(r.target).provider) || failed" x-text="initials(targetParts(r.target).provider)"></span>
                            </span>
                            <span x-text="brandName(targetParts(r.target).provider)"></span>
                            <span x-show="targetParts(r.target).upstream"><span class="text-secondary mx-2">as</span><span class="mono" x-text="targetParts(r.target).upstream"></span></span>
                          </div>
                        </template>
                      </td>
                      <td class="text-nowrap">
                        <button class="btn btn-sm btn-ghost-secondary btn-icon" title="Edit" @click="startModel(r)"><i class="ti ti-pencil"></i></button>
                        <button class="btn btn-sm btn-ghost-danger btn-icon" title="Remove" @click="removeModel(r)"><i class="ti ti-trash"></i></button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
              </div>
              <div class="empty" x-show="!model.models.length">
                <div class="empty-icon"><i class="ti ti-route-off"></i></div>
                <p class="empty-title">No model yet</p>
                <p class="empty-subtitle text-secondary">A model gives clients a name to ask for and says which provider answers it. Without any, clients must name both, as provider/model.</p>
                <div class="empty-action"><button class="btn btn-primary" @click="startModel(null)"><i class="ti ti-plus me-1"></i>Add model</button></div>
              </div>
            </div>
          </div>

          <!-- Clients -->
          <div x-show="tab === 'clients'">
            <div class="card">
              <div class="table-responsive" x-show="model.clients.length">
              <table class="table card-table table-vcenter">
                <thead><tr><th>Client</th><th>Key</th><th>May use</th><th>Enabled</th><th class="w-1"></th></tr></thead>
                <tbody>
                  <template x-for="c in model.clients" :key="c.uid">
                    <tr>
                      <td><i class="ti ti-key me-2 text-secondary"></i><span class="mono fw-bold" x-text="c.name"></span></td>
                      <td class="mono text-secondary" x-text="isHidden(c.key) ? '•••• ' + hiddenName(c.key) : c.key"></td>
                      <td :class="c.access === 'some' && 'mono'" x-text="accessSummary(c)"></td>
                      <td><label class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" :checked="c.enabled" @change="setClientEnabled(c, $event.target.checked)"></label></td>
                      <td class="text-nowrap">
                        <button class="btn btn-sm btn-ghost-secondary btn-icon" title="Edit" @click="startClient(c)"><i class="ti ti-pencil"></i></button>
                        <button class="btn btn-sm btn-ghost-danger btn-icon" title="Remove" @click="removeClient(c)"><i class="ti ti-trash"></i></button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
              </div>
              <div class="empty" x-show="!model.clients.length">
                <div class="empty-icon"><i class="ti ti-lock-open"></i></div>
                <p class="empty-title">No client key</p>
                <p class="empty-subtitle text-secondary">Anyone who reaches the gateway may use it. Add a key, and only the tools that present one are answered.</p>
                <div class="empty-action"><button class="btn btn-primary" @click="startClient(null)"><i class="ti ti-plus me-1"></i>Add client</button></div>
              </div>
            </div>
          </div>

          <!-- Activity -->
          <div x-show="tab === 'activity'">
            <div class="card mb-3">
              <div class="card-header"><h3 class="card-title"><i class="ti ti-loader-2 me-2"></i>In flight</h3></div>
              <div class="table-responsive" x-show="(activity?.in_flight || []).length">
              <table class="table card-table table-sm">
                <thead><tr><th>Started</th><th>Client</th><th>Model</th><th>Account</th><th>Phase</th><th class="text-end">Elapsed</th></tr></thead>
                <tbody>
                  <template x-for="r in activity?.in_flight || []" :key="r.id">
                    <tr>
                      <td x-text="clock(r.t)"></td>
                      <td><span x-text="r.client || r.program"></span> <span class="text-secondary" x-show="r.client" x-text="'(' + r.program + ')'"></span></td>
                      <td class="mono" x-text="r.model"></td>
                      <td class="mono" x-text="accountOf(r)"></td>
                      <td><span class="badge" :class="r.phase === 'streaming' ? 'bg-green-lt' : 'bg-yellow-lt'" x-text="r.phase"></span></td>
                      <td class="text-end" x-text="duration(activity.now - r.t)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              </div>
              <div class="card-body text-secondary" x-show="!(activity?.in_flight || []).length">Nothing in flight.</div>
            </div>
            <div class="card mb-3">
              <div class="card-header"><h3 class="card-title"><i class="ti ti-messages me-2"></i>Sessions</h3></div>
              <div class="table-responsive" x-show="(activity?.sessions || []).length">
              <table class="table card-table table-sm table-hover">
                <thead><tr><th>Last active</th><th>Client</th><th>Session</th><th>Model</th><th class="text-end">Requests</th><th class="text-end">Input</th><th class="text-end">Output</th><th class="text-end">Cache hit</th><th>Accounts</th></tr></thead>
                <tbody>
                  <template x-for="s in activity?.sessions || []" :key="s.id">
                    <tr style="cursor: pointer" @click="openSession(s)" :class="session?.id === s.id && 'table-active'">
                      <td x-text="ago(s.last)"></td>
                      <td><span x-text="s.client || s.program"></span> <span class="text-secondary" x-show="s.client" x-text="'(' + s.program + ')'"></span></td>
                      <td class="mono text-secondary" :title="s.id" x-text="short(s.id)"></td>
                      <td class="mono" x-text="s.last_model"></td>
                      <td class="text-end"><span x-text="s.requests"></span><span class="text-danger" x-show="s.failures" x-text="' (' + s.failures + ' failed)'"></span></td>
                      <td class="text-end" x-text="count(s.tokens.input)"></td>
                      <td class="text-end" x-text="count(s.tokens.output)"></td>
                      <td class="text-end" x-text="cacheShare(s.tokens)"></td>
                      <td class="mono"><span x-text="s.accounts.join(', ')"></span> <span class="badge bg-orange-lt" x-show="s.switches" x-text="s.switches + ' switches'"></span></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              </div>
              <div class="card-body text-secondary" x-show="!(activity?.sessions || []).length">No session yet.</div>
            </div>
            <div class="card mb-3">
              <div class="card-header">
                <h3 class="card-title"><i class="ti ti-list-details me-2"></i><span x-text="session ? 'Requests of session ' + short(session.id) : 'Recent requests'"></span></h3>
                <div class="card-actions" x-show="session"><button class="btn btn-sm" @click="session = null; sessionRequests = []">Show all recent</button></div>
              </div>
              <div class="table-responsive" x-show="shownRequests().length">
              <table class="table card-table table-sm">
                <thead><tr><th>Time</th><th>Client</th><th>Model</th><th>Served by</th><th>Status</th><th class="text-end">First content</th><th class="text-end">Total</th><th class="text-end">Input</th><th class="text-end">Output</th><th class="text-end">Cached</th></tr></thead>
                <tbody>
                  <template x-for="r in shownRequests()" :key="r.id">
                    <tr>
                      <td>
                        <a href="#" class="text-reset" @click.prevent="expanded[r.id] = !expanded[r.id]"><i class="ti me-1 text-secondary" :class="expanded[r.id] ? 'ti-chevron-down' : 'ti-chevron-right'"></i><span x-text="clock(r.t)"></span></a>
                        <div x-show="expanded[r.id]" class="small text-secondary mt-1">
                          <div x-show="r.session" class="mono" x-text="'session ' + r.session + (r.subagent ? ', subagent ' + r.subagent : '')"></div>
                          <div x-text="r.protocol + (r.stream ? ', streamed' : '')"></div>
                          <template x-for="a in r.attempt_list || []">
                            <div class="mono" x-text="a.provider + '/' + a.account + ' ' + a.model + ': ' + a.outcome + ' (' + duration(a.ms) + ')'"></div>
                          </template>
                          <div x-show="r.note" class="text-danger" x-text="r.note"></div>
                        </div>
                      </td>
                      <td><span x-text="r.client || r.program"></span> <span class="text-secondary" x-show="r.client" x-text="'(' + r.program + ')'"></span></td>
                      <td class="mono" x-text="r.model"></td>
                      <td class="mono">
                        <span x-text="accountOf(r)"></span>
                        <span class="badge bg-orange-lt" x-show="r.attempts > 1" x-text="r.attempts + ' tries'"></span>
                      </td>
                      <td><span class="badge" :class="r.failed || r.status >= 400 ? 'bg-red-lt' : 'bg-green-lt'" x-text="r.phase && r.phase !== 'done' ? r.phase : r.status"></span></td>
                      <td class="text-end" x-text="r.first_content_ms == null ? '' : duration(r.first_content_ms)"></td>
                      <td class="text-end" x-text="r.ms == null ? '' : duration(r.ms)"></td>
                      <td class="text-end" x-text="r.tokens ? count(r.tokens.input) : ''"></td>
                      <td class="text-end" x-text="r.tokens ? count(r.tokens.output) : ''"></td>
                      <td class="text-end" x-text="r.tokens ? count(r.tokens.cache_read) : ''"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              </div>
              <div class="card-body text-secondary" x-show="!shownRequests().length">No request recorded since the gateway started.</div>
            </div>
          </div>

          <!-- Usage -->
          <div x-show="tab === 'usage'">
            <div class="d-flex mb-3 align-items-center flex-wrap gap-2">
              <div class="btn-group me-auto">
                <template x-for="d in [1, 7, 30]">
                  <button class="btn" :class="usageDays === d && 'active'" @click="usageDays = d; refreshUsage()" x-text="d === 1 ? 'Today' : d + ' days'"></button>
                </template>
              </div>
              <div class="btn-group">
                <template x-for="g in usageGroups">
                  <button class="btn" :class="usageBy === g.id && 'active'" @click="usageBy = g.id" x-text="'By ' + g.label.toLowerCase()"></button>
                </template>
              </div>
            </div>
            <div class="row row-cards mb-3">
              <template x-for="tile in tiles(usage)" :key="tile.label">
                <div class="col-6 col-lg-3">
                  <div class="card card-sm"><div class="card-body">
                    <div class="row align-items-center">
                      <div class="col-auto"><span class="avatar bg-primary-lt"><i class="ti" :class="tile.icon"></i></span></div>
                      <div class="col">
                        <div class="h2 mb-0"><span x-text="tile.value"></span> <span class="fs-5 text-danger fw-normal" x-show="tile.note" x-text="tile.note"></span></div>
                        <div class="text-secondary" x-text="tile.label"></div>
                      </div>
                    </div>
                  </div></div>
                </div>
              </template>
            </div>
            <div class="card mb-3">
              <div class="table-responsive" x-show="(usage?.[usageBy] || []).length">
              <table class="table card-table table-sm">
                <thead><tr><th x-text="usageGroups.find(g => g.id === usageBy).label"></th><th class="text-end">Requests</th><th class="text-end">Failed</th><th class="text-end">Input</th><th class="text-end">Output</th><th class="text-end">Cache read</th><th class="text-end">Cache write</th><th class="text-end">Cache hit</th></tr></thead>
                <tbody>
                  <template x-for="row in usage?.[usageBy] || []" :key="row.name">
                    <tr>
                      <td class="mono" x-text="row.name"></td>
                      <td class="text-end" x-text="row.requests"></td>
                      <td class="text-end" :class="row.failures && 'text-danger'" x-text="row.failures"></td>
                      <td class="text-end" x-text="count(row.tokens.input)"></td>
                      <td class="text-end" x-text="count(row.tokens.output)"></td>
                      <td class="text-end" x-text="count(row.tokens.cache_read)"></td>
                      <td class="text-end" x-text="count(row.tokens.cache_write)"></td>
                      <td class="text-end" x-text="cacheShare(row.tokens)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              </div>
              <div class="empty" x-show="!(usage?.[usageBy] || []).length">
                <div class="empty-icon"><i class="ti ti-chart-bar-off"></i></div>
                <p class="empty-title">No request in this period.</p>
              </div>
            </div>
          </div>

          <!-- Settings -->
          <div x-show="tab === 'settings'">
            <div class="card mb-3">
              <div class="card-header">
                <h3 class="card-title"><i class="ti ti-server me-2"></i>Gateway</h3>
                <div class="card-actions"><button class="btn btn-sm" @click="reloadFile()" title="Use it after editing the file by hand."><i class="ti ti-refresh me-1"></i>Read the file again</button></div>
              </div>
              <div class="card-body">
                <div class="datagrid">
                  <div class="datagrid-item">
                    <div class="datagrid-title">Listens on</div>
                    <div class="datagrid-content mono" x-text="status?.listen || '–'"></div>
                  </div>
                  <div class="datagrid-item">
                    <div class="datagrid-title">Configuration file</div>
                    <div class="datagrid-content mono" x-text="path || '–'"></div>
                  </div>
                  <div class="datagrid-item">
                    <div class="datagrid-title">Panel token</div>
                    <div class="datagrid-content">Set in the file</div>
                  </div>
                </div>
              </div>
              <div class="card-footer text-secondary">The address and the panel token are changed in the configuration file alone. A new address takes effect after a restart.</div>
            </div>

            <template x-if="settings">
            <div class="card mb-3">
              <div class="card-header"><h3 class="card-title"><i class="ti ti-adjustments me-2"></i>Behaviour</h3></div>
              <div class="card-body">
                <div class="row g-4">
                  <template x-for="f in settingFields" :key="f.name">
                    <div class="col-md-6">
                      <label class="form-label"><span x-text="f.label"></span><span class="form-label-description mono" x-text="f.name"></span></label>
                      <input class="form-control mono" x-model="settings[f.name]" :placeholder="f.placeholder">
                      <div class="form-hint" x-text="f.help"></div>
                    </div>
                  </template>
                  <div class="col-12">
                    <label class="form-check form-switch mb-0">
                      <input class="form-check-input" type="checkbox" x-model="settings.strict">
                      <span class="form-check-label">Strict</span>
                      <span class="form-check-description">Refuse a request the model cannot take exactly as it is, where the gateway would otherwise adapt it.</span>
                    </label>
                  </div>
                </div>
              </div>
              <div class="card-footer d-flex gap-2 justify-content-end">
                <button class="btn btn-ghost-secondary" x-show="settingsChanged()" @click="settings = { ...model.advanced }">Undo</button>
                <button class="btn btn-primary" :disabled="!settingsChanged() || saving" @click="saveSettings()"><i class="ti ti-device-floppy me-1"></i>Save</button>
              </div>
            </div>
            </template>

            <div class="card">
              <div class="card-header"><h3 class="card-title"><i class="ti ti-braces me-2"></i>The file as JSON</h3></div>
              <div class="card-body">
                <div class="text-secondary mb-2">Everything the pages edit, and what they do not. Keys are hidden behind a fingerprint and kept as they are when saved. Comments in the file are not kept.</div>
                <textarea class="form-control mono" rows="18" x-model="jsonText" spellcheck="false"></textarea>
                <div class="text-danger mt-2" x-text="jsonError"></div>
              </div>
              <div class="card-footer d-flex gap-2 justify-content-end">
                <button class="btn btn-ghost-secondary" x-show="jsonChanged()" @click="showSettings()">Undo</button>
                <button class="btn btn-primary" :disabled="!jsonChanged() || saving" @click="saveJSON()"><i class="ti ti-device-floppy me-1"></i>Save</button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Add an account -->
    <template x-if="draft && !signing">
      <div>
        <div class="modal modal-blur show d-block" tabindex="-1" @mousedown.self="draft = null" @keydown.escape.window="draft = null">
          <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" x-text="draft.step === 'pick' ? 'Add an account' : draft.provider ? 'Add an account of ' + brandName(draft.provider) : 'Add your own address'"></h5>
                <button type="button" class="btn-close" @click="draft = null"></button>
              </div>

              <template x-if="draft.step === 'pick'">
                <div class="modal-body">
                  <div class="input-icon mb-3">
                    <span class="input-icon-addon"><i class="ti ti-search"></i></span>
                    <input class="form-control" x-model="draft.query" placeholder="Search providers" x-init="$nextTick(() => $el.focus())">
                  </div>
                  <template x-for="group in providerChoices()" :key="group.label">
                    <div class="mb-3">
                      <div class="subheader mb-2" x-text="group.label"></div>
                      <div class="row g-2">
                        <template x-for="id in group.ids" :key="id">
                          <div class="col-6 col-md-4">
                            <a class="card card-sm card-link" href="#" @click.prevent="pickProvider(id)">
                              <div class="card-body d-flex align-items-center p-2">
                                <span class="avatar avatar-sm brand me-2" x-data="{ failed: false }">
                                  <img :src="brandIcon(id) || null" x-show="brandIcon(id) && !failed" @error="failed = true" alt="" loading="lazy">
                                  <span x-show="!brandIcon(id) || failed" x-text="initials(id)"></span>
                                </span>
                                <div class="text-truncate">
                                  <div class="fw-medium text-truncate" x-text="brandName(id)"></div>
                                  <div class="mono small text-secondary text-truncate" x-show="brandName(id) !== id" x-text="id"></div>
                                </div>
                              </div>
                            </a>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>
                  <div class="subheader mb-2">Not in the list</div>
                  <a class="card card-sm card-link" href="#" @click.prevent="pickProvider('')">
                    <div class="card-body d-flex align-items-center p-2">
                      <span class="avatar avatar-sm me-2"><i class="ti ti-world-plus"></i></span>
                      <div>
                        <div>Your own address</div>
                        <div class="small text-secondary">A relay or a local server that speaks one of the usual protocols.</div>
                      </div>
                    </div>
                  </a>
                </div>
              </template>

              <template x-if="draft.step === 'details'">
                <div class="modal-body">
                  <div class="alert alert-warning" x-show="draft.provider === 'antigravity'" x-text="antigravityRisk"></div>
                  <div class="row g-3">
                    <div class="col-md-6" x-show="takesKeys(draft.provider)">
                      <label class="form-label">Key</label>
                      <input class="form-control mono" x-model="draft.key" placeholder="sk-… or ${ENV_VAR}" autocomplete="off">
                      <div class="form-hint" x-show="!draft.provider">May stay empty for an address without authentication.</div>
                      <div class="form-hint" x-show="keyOptional(draft.provider)">May stay empty: the free models need no key.</div>
                      <div class="form-hint" x-show="signsIn(draft.provider)">Or leave it empty and sign in instead. For your own use only: the plan is personal.</div>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Name</label>
                      <input class="form-control mono" x-model="draft.name" @input="draftChanged()">
                      <div class="form-hint">Tells this account from the others, here and in the logs.</div>
                    </div>
                    <template x-if="!draft.provider">
                      <div class="col-12">
                        <div class="row g-3">
                          <div class="col-md-8">
                            <label class="form-label">Address</label>
                            <div class="input-group">
                              <select class="form-select" style="max-width: 9rem" x-model="draft.protocol">
                                <template x-for="proto in protocols" :key="proto"><option :value="proto" x-text="proto" :selected="draft.protocol === proto"></option></template>
                              </select>
                              <input class="form-control mono" x-model="draft.url" placeholder="https://relay.example.com/v1">
                            </div>
                            <div class="form-hint">The protocol the address speaks, and where it is.</div>
                          </div>
                          <div class="col-md-4">
                            <label class="form-label">Behaves like</label>
                            <select class="form-select" x-model="draft.preset">
                              <option value="">nothing built in</option>
                              <template x-for="id in presets" :key="id"><option :value="id" x-text="id"></option></template>
                            </select>
                            <div class="form-hint">Borrows a provider's quirks.</div>
                          </div>
                        </div>
                      </div>
                    </template>
                    <div class="col-12" x-show="draft.suggestions.length">
                      <label class="form-label">Models to answer with this account</label>
                      <template x-for="s in draft.suggestions" :key="s.name">
                        <label class="form-check">
                          <input class="form-check-input" type="checkbox" x-model="s.chosen">
                          <span class="form-check-label">
                            <code x-text="s.name"></code>
                            <span class="text-secondary" x-show="s.current" x-text="'(now ' + s.current + ')'"></span>
                          </span>
                        </label>
                      </template>
                      <div class="form-hint">Clients that ask for these names are answered by this provider.</div>
                    </div>
                  </div>
                  <div class="text-danger mt-3" x-show="saveError" x-text="saveError"></div>
                </div>
              </template>

              <div class="modal-footer" x-show="draft.step === 'details'">
                <button class="btn btn-ghost-secondary me-auto" @click="draft.step = 'pick'"><i class="ti ti-arrow-left me-1"></i>Back</button>
                <span class="text-secondary" x-text="draftProblem()"></span>
                <button class="btn btn-primary" x-show="draftSignsIn()" @click="startSignIn(draft.provider, draft.name.trim(), true)" :disabled="!!draftProblem()"><i class="ti ti-login-2 me-1"></i>Sign in and add</button>
                <button class="btn btn-primary" x-show="!draftSignsIn()" @click="addAccount()" :disabled="!!draftProblem() || saving"><i class="ti ti-plus me-1"></i>Add</button>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-backdrop show"></div>
      </div>
    </template>

    <!-- Edit an account -->
    <template x-if="accountEdit">
      <div>
        <div class="modal modal-blur show d-block" tabindex="-1" @mousedown.self="accountEdit = null" @keydown.escape.window="accountEdit = null">
          <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" x-text="'Edit ' + accountEdit.original"></h5>
                <button type="button" class="btn-close" @click="accountEdit = null"></button>
              </div>
              <div class="modal-body">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Name</label>
                    <input class="form-control mono" x-model="accountEdit.name">
                    <div class="form-hint" x-show="signsIn(accountEdit.provider)">A sign-in belongs to the name: a renamed account signs in again.</div>
                  </div>
                  <div class="col-md-6" x-show="takesKeys(accountEdit.provider)">
                    <label class="form-label">Key</label>
                    <template x-if="isHidden(accountEdit.key)">
                      <div class="input-group">
                        <input class="form-control mono" :value="'•••• ' + hiddenName(accountEdit.key)" disabled>
                        <button class="btn" @click="accountEdit.key = ''">Replace</button>
                      </div>
                    </template>
                    <template x-if="!isHidden(accountEdit.key)">
                      <input class="form-control mono" x-model="accountEdit.key" :placeholder="signsIn(accountEdit.provider) ? 'none: signs in' : 'sk-… or ${ENV_VAR}'" autocomplete="off">
                    </template>
                  </div>
                  <template x-if="accountEdit.custom">
                    <div class="col-12">
                      <label class="form-label">Addresses</label>
                      <template x-for="(e, ei) in accountEdit.endpoints" :key="e.uid">
                        <div class="input-group mb-2">
                          <select class="form-select" style="max-width: 9rem" x-model="e.protocol">
                            <template x-for="proto in protocols" :key="proto"><option :value="proto" x-text="proto" :selected="e.protocol === proto"></option></template>
                          </select>
                          <input class="form-control mono" x-model="e.url">
                          <button class="btn btn-icon" title="Remove" @click="accountEdit.endpoints.splice(ei, 1)"><i class="ti ti-x"></i></button>
                        </div>
                      </template>
                      <button class="btn btn-sm" @click="accountEdit.endpoints.push({ uid: uid(), protocol: 'chat', url: '' })"><i class="ti ti-plus me-1"></i>Address</button>
                      <label class="form-label mt-3">Headers sent with each request</label>
                      <template x-for="(h, hi) in accountEdit.headers" :key="h.uid">
                        <div class="input-group mb-2">
                          <input class="form-control mono" style="max-width: 14rem" x-model="h.name" placeholder="Header-Name">
                          <input class="form-control mono" x-model="h.value" placeholder="value or ${ENV_VAR}">
                          <button class="btn btn-icon" title="Remove" @click="accountEdit.headers.splice(hi, 1)"><i class="ti ti-x"></i></button>
                        </div>
                      </template>
                      <button class="btn btn-sm" @click="accountEdit.headers.push({ uid: uid(), name: '', value: '' })"><i class="ti ti-plus me-1"></i>Header</button>
                      <div class="form-hint mt-2" x-show="accountEdit.preset" x-text="'behaves like ' + accountEdit.preset"></div>
                    </div>
                  </template>
                </div>
                <div class="text-danger mt-3" x-show="saveError" x-text="saveError"></div>
              </div>
              <div class="modal-footer">
                <button class="btn btn-ghost-secondary" @click="accountEdit = null">Cancel</button>
                <button class="btn btn-primary" :disabled="!accountEdit.name.trim() || saving" @click="saveAccount()"><i class="ti ti-device-floppy me-1"></i>Save</button>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-backdrop show"></div>
      </div>
    </template>

    <!-- Add or edit a model -->
    <template x-if="modelEdit">
      <div>
        <div class="modal modal-blur show d-block" tabindex="-1" @mousedown.self="modelEdit = null" @keydown.escape.window="modelEdit = null">
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" x-text="modelEdit.original === null ? 'Add a model' : 'Edit ' + modelEdit.original"></h5>
                <button type="button" class="btn-close" @click="modelEdit = null"></button>
              </div>
              <div class="modal-body">
                <div class="mb-3">
                  <label class="form-label">Clients ask for</label>
                  <input class="form-control mono" x-model="modelEdit.name" placeholder="claude-*, fast, *" x-init="modelEdit.original === null && $nextTick(() => $el.focus())">
                  <div class="form-hint">A star stands for any run of characters: claude-* takes every name that starts with claude-, and a star alone takes every name no other model takes.</div>
                </div>
                <template x-if="modelEdit.raw !== undefined">
                  <div>
                    <label class="form-label">Answered by</label>
                    <pre class="mb-2" x-text="JSON.stringify(modelEdit.raw, null, 2)"></pre>
                    <div class="form-hint">This model has more than one target: change them under Settings, in the file as JSON.</div>
                  </div>
                </template>
                <template x-if="modelEdit.raw === undefined">
                  <div>
                    <label class="form-label">Answered by</label>
                    <div class="form-selectgroup w-100 mb-3">
                      <label class="form-selectgroup-item flex-fill">
                        <input type="radio" class="form-selectgroup-input" value="provider" x-model="modelEdit.kind">
                        <span class="form-selectgroup-label"><i class="ti ti-building-store me-1"></i>A provider</span>
                      </label>
                      <label class="form-selectgroup-item flex-fill">
                        <input type="radio" class="form-selectgroup-input" value="alias" x-model="modelEdit.kind" :disabled="!menuNames().some(n => !n.includes('*') && n !== modelEdit.original)">
                        <span class="form-selectgroup-label"><i class="ti ti-corner-down-right me-1"></i>Another model</span>
                      </label>
                    </div>
                    <div x-show="modelEdit.kind === 'provider'">
                      <select class="form-select mb-3" x-model="modelEdit.provider">
                        <template x-for="id in targetProviders()" :key="id">
                          <option :value="id" :selected="modelEdit.provider === id" x-text="brandName(id) === id ? id : brandName(id) + ' (' + id + ')'"></option>
                        </template>
                      </select>
                      <label class="form-label">Model the provider is asked for</label>
                      <input class="form-control mono" x-model="modelEdit.upstream" placeholder="deepseek-chat">
                      <div class="form-hint">Leave it empty to pass on the name the client asked for.</div>
                    </div>
                    <div x-show="modelEdit.kind === 'alias'">
                      <select class="form-select mono" x-model="modelEdit.alias">
                        <option value="" :selected="!modelEdit.alias">–</option>
                        <template x-for="name in menuNames().filter(n => !n.includes('*') && n !== modelEdit.original)" :key="name">
                          <option :value="name" :selected="modelEdit.alias === name" x-text="name"></option>
                        </template>
                      </select>
                      <div class="form-hint">Asking for this name is the same as asking for that one.</div>
                    </div>
                  </div>
                </template>
                <div class="text-danger mt-3" x-show="saveError" x-text="saveError"></div>
              </div>
              <div class="modal-footer">
                <span class="text-secondary me-auto" x-text="modelProblem()"></span>
                <button class="btn btn-ghost-secondary" @click="modelEdit = null">Cancel</button>
                <button class="btn btn-primary" :disabled="!!modelProblem() || saving" @click="saveModel()"><i class="ti ti-device-floppy me-1"></i>Save</button>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-backdrop show"></div>
      </div>
    </template>

    <!-- Add or edit a client -->
    <template x-if="clientEdit">
      <div>
        <div class="modal modal-blur show d-block" tabindex="-1" @mousedown.self="clientEdit = null" @keydown.escape.window="clientEdit = null">
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" x-text="clientEdit.original === null ? 'Add a client' : 'Edit ' + clientEdit.original"></h5>
                <button type="button" class="btn-close" @click="clientEdit = null"></button>
              </div>
              <div class="modal-body">
                <div class="mb-3">
                  <label class="form-label">Name</label>
                  <input class="form-control mono" x-model="clientEdit.name" placeholder="laptop" x-init="clientEdit.original === null && $nextTick(() => $el.focus())">
                  <div class="form-hint">Who holds the key: a person, a machine or a tool. Usage is counted under it.</div>
                </div>
                <div class="mb-3">
                  <label class="form-label">Key</label>
                  <template x-if="isHidden(clientEdit.key)">
                    <div class="input-group">
                      <input class="form-control mono" :value="'•••• ' + hiddenName(clientEdit.key)" disabled>
                      <button class="btn" @click="clientEdit.key = generateSecret()">Replace</button>
                    </div>
                  </template>
                  <template x-if="!isHidden(clientEdit.key)">
                    <div>
                      <div class="input-group">
                        <input class="form-control mono" x-model="clientEdit.key" placeholder="key or ${ENV_VAR}" autocomplete="off">
                        <button class="btn btn-icon" title="Generate" @click="clientEdit.key = generateSecret()"><i class="ti ti-dice-5"></i></button>
                        <button class="btn btn-icon" title="Copy" @click="copy(clientEdit.key)"><i class="ti ti-copy"></i></button>
                      </div>
                      <div class="form-hint">Copy it now: once saved, the panel shows only its fingerprint.</div>
                    </div>
                  </template>
                </div>
                <label class="form-label">May use</label>
                <div class="form-selectgroup form-selectgroup-boxes d-flex flex-column">
                  <label class="form-selectgroup-item flex-fill">
                    <input type="radio" class="form-selectgroup-input" value="menu" x-model="clientEdit.access">
                    <span class="form-selectgroup-label d-flex align-items-center p-3">
                      <span class="me-3"><span class="form-selectgroup-check"></span></span>
                      <span><span class="d-block">Every model</span><span class="d-block text-secondary">The names on the Models page.</span></span>
                    </span>
                  </label>
                  <label class="form-selectgroup-item flex-fill">
                    <input type="radio" class="form-selectgroup-input" value="some" x-model="clientEdit.access">
                    <span class="form-selectgroup-label d-flex align-items-center p-3">
                      <span class="me-3"><span class="form-selectgroup-check"></span></span>
                      <span><span class="d-block">Some models</span><span class="d-block text-secondary">Only the ones you choose.</span></span>
                    </span>
                  </label>
                  <label class="form-selectgroup-item flex-fill">
                    <input type="radio" class="form-selectgroup-input" value="all" x-model="clientEdit.access">
                    <span class="form-selectgroup-label d-flex align-items-center p-3">
                      <span class="me-3"><span class="form-selectgroup-check"></span></span>
                      <span><span class="d-block">Everything, provider/model too</span><span class="d-block text-secondary">Any model of any account, named directly.</span></span>
                    </span>
                  </label>
                </div>
                <div class="mt-3" x-show="clientEdit.access === 'some'">
                  <div class="d-flex flex-wrap gap-3 mb-2">
                    <template x-for="name in menuNames()" :key="name">
                      <label class="form-check mb-0">
                        <input class="form-check-input" type="checkbox" :checked="clientEdit.chosen.includes(name)" @change="toggle(clientEdit.chosen, name)">
                        <span class="form-check-label mono" x-text="name"></span>
                      </label>
                    </template>
                  </div>
                  <input class="form-control mono" x-model="clientEdit.extra" placeholder="also, comma-separated: deepseek/*, openai/gpt-4o">
                </div>
                <div class="text-danger mt-3" x-show="saveError" x-text="saveError"></div>
              </div>
              <div class="modal-footer">
                <span class="text-secondary me-auto" x-text="clientProblem()"></span>
                <button class="btn btn-ghost-secondary" @click="clientEdit = null">Cancel</button>
                <button class="btn btn-primary" :disabled="!!clientProblem() || saving" @click="saveClient()"><i class="ti ti-device-floppy me-1"></i>Save</button>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-backdrop show"></div>
      </div>
    </template>

    <!-- Sign an account in -->
    <template x-if="signing">
      <div>
        <div class="modal modal-blur show d-block" tabindex="-1">
          <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title"><i class="ti ti-login-2 me-2"></i><span x-text="'Sign in ' + signing.provider + '/' + signing.account"></span></h5>
                <button type="button" class="btn-close" @click="signing = null"></button>
              </div>
              <div class="modal-body">
                <div class="alert alert-warning" x-show="signing.provider === 'antigravity'" x-text="antigravityRisk"></div>
                <ol class="ps-3">
                  <li class="mb-2">Open <a :href="signing.url" target="_blank" rel="noopener noreferrer">the sign-in page</a> <span x-text="signing.provider === 'antigravity' ? 'and sign in with the Google account.' : 'and sign in to ChatGPT.'"></span></li>
                  <li class="mb-2">The browser then goes to an address starting with <code x-text="signing.redirect"></code>, which does not load unless the browser runs on the gateway's machine: the sign-in sends it back only to a loopback address. Copy that whole address from the address bar and paste it here:</li>
                </ol>
                <input class="form-control mono" x-model="signing.callback" :placeholder="signing.redirect + '?code=…'" autocomplete="off" @keydown.enter="signing.callback.trim() && finishSignIn()">
                <div class="text-danger mt-2" x-text="signing.error"></div>
              </div>
              <div class="modal-footer">
                <button class="btn btn-ghost-secondary" @click="signing = null">Cancel</button>
                <button class="btn btn-primary" :disabled="!signing.callback.trim() || signing.busy" @click="finishSignIn()"><i class="ti ti-check me-1"></i>Finish</button>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-backdrop show"></div>
      </div>
    </template>

    <!-- A question before something is removed -->
    <template x-if="question">
      <div>
        <div class="modal modal-blur show d-block" tabindex="-1" @mousedown.self="question = null" @keydown.escape.window="question = null">
          <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-status bg-danger"></div>
              <div class="modal-body text-center py-4">
                <i class="ti ti-alert-triangle text-danger fs-1 mb-2"></i>
                <h3 x-text="question.title"></h3>
                <div class="text-secondary" x-text="question.text"></div>
              </div>
              <div class="modal-footer">
                <div class="w-100">
                  <div class="row">
                    <div class="col"><button class="btn w-100" @click="question = null">Cancel</button></div>
                    <div class="col"><button class="btn btn-danger w-100" @click="answer()" x-text="question.action"></button></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-backdrop show"></div>
      </div>
    </template>

    <!-- The file changed elsewhere -->
    <template x-if="conflict">
      <div>
        <div class="modal modal-blur show d-block" tabindex="-1">
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-status bg-warning"></div>
              <div class="modal-body text-center py-4">
                <i class="ti ti-file-alert text-warning fs-1 mb-2"></i>
                <h3>The configuration file changed</h3>
                <div class="text-secondary">It was edited outside the panel after this page read it. Load the file to see it as it is now, without your change; or save your change over it, and what was edited there is lost.</div>
              </div>
              <div class="modal-footer">
                <div class="w-100">
                  <div class="row">
                    <div class="col"><button class="btn w-100" :disabled="saving" @click="takeFile()"><i class="ti ti-refresh me-1"></i>Load the file</button></div>
                    <div class="col"><button class="btn btn-warning w-100" :disabled="saving" @click="overwrite()"><i class="ti ti-device-floppy me-1"></i>Save over it</button></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-backdrop show"></div>
      </div>
    </template>

    <!-- Messages -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1040">
      <template x-for="m in messages" :key="m.id">
        <div class="toast show" role="alert">
          <div class="toast-header">
            <i class="ti me-2" :class="messageIcon(m.kind)"></i>
            <strong class="me-auto" x-text="m.title"></strong>
            <button type="button" class="ms-2 btn-close" @click="messages = messages.filter(other => other.id !== m.id)"></button>
          </div>
          <div class="toast-body" x-show="m.text" style="white-space: pre-wrap" x-text="m.text"></div>
        </div>
      </template>
    </div>
  </div>
  </template>
</div>

<script src="i18n.js"></script>
<script src="panel.js"></script>
</body>
</html>
